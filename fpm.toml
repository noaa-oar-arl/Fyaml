name = "fyaml"
version = "0.2.0"
license = "LICENSE"

[build]
auto-executables = true
auto-tests = false
auto-examples = true
module-naming = false

[library]
source-dir = "src"

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
[preprocess.cpp]
suffixes = ["f90"]
directories = ["tests"]
macros = ["SOURCE_DIR='./src/'"]

[[test]]
name = "test_anchors"
source-dir = "tests"
main = "test_anchors.f90"

